version: 2
updates:
  # Actions are pinned by commit SHA. Dependabot keeps the pins, and the
  # version comment beside each one, current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  # Module dependencies. govulncheck in CI reports reachable advisories; this
  # keeps the versions moving so they are rarely reachable in the first place.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: [ "*" ]

  # The GO_IMAGE and BASE_IMAGE build arguments in the Dockerfile. A GO_IMAGE
  # bump must come with the same toolchain line in go.mod; the "Toolchain
  # versions agree" CI check fails until both match.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
