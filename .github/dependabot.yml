version: 2
updates:
  # Actions are pinned by commit SHA. Dependabot keeps the pins, and the
  # version comment beside each one, current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  # Module dependencies. govulncheck in CI reports reachable advisories; this
  # keeps the versions moving so they are rarely reachable in the first place.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: [ "*" ]

  # The two FROM lines in the Dockerfile. They are pinned by digest, and
  # Dependabot updates the tag and the digest together. A golang bump must come
  # with the same toolchain line in go.mod; the "Toolchain versions agree" CI
  # check fails until both match.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
