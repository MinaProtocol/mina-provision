name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily, to notice a published artifact moving before an operator does.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Read-only unless a job asks for more. The repository default grants write
# to every scope, so a job without its own block would otherwise get it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

      - name: go build
        run: go build ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=ci-${{ github.sha }}

  deb:
    name: deb build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary and package
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/mina-provision .
          packaging/build-deb.sh dist/mina-provision 0.0.0-ci "$(dpkg --print-architecture)" dist
      - name: Package is owned by root
        # dpkg applies the ownership recorded in the archive. Built without
        # --root-owner-group it records the builder's uid, which on a target
        # host is an unprivileged user who could then replace the binary.
        run: |
          set -euo pipefail
          listing="$(dpkg-deb -c dist/*.deb)"
          echo "$listing"
          if echo "$listing" | grep -vq "root/root"; then
            echo "the package records ownership other than root/root" >&2
            echo "$listing" | grep -v "root/root" >&2
            exit 1
          fi

      - name: Package installs and runs
        run: |
          sudo dpkg -i dist/*.deb
          test "$(stat -c %U:%G /usr/bin/mina-provision)" = "root:root"
          mina-provision --help

      - name: Every documented command exists
        # The live job is the only other place these names are typed, and it
        # does not run on a pull request -- so without this check a rename
        # passes review and fails on the next scheduled run instead.
        run: |
          set -euo pipefail
          for c in archive blocks daemon-config genesis-config replayer-input; do
            echo "--- $c"
            mina-provision "$c" --help > /dev/null
          done

  live:
    name: live artifact check
    # The default tests never touch the network. This job does, so it runs on a
    # schedule and on demand rather than on every pull request: a published
    # artifact moving is not a reason to block a code change, but it is a
    # reason to find out.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o mina-provision .
      - name: Fetch the daemon config from the live repository
        run: |
          ./mina-provision daemon-config --network mainnet --out ./out -v
          test -n "$(ls ./out/config_*.json)"

      - name: Fetch the fork config and convert it for the replayer
        run: |
          set -euo pipefail
          ./mina-provision genesis-config --network mainnet --out ./out -v
          ./mina-provision replayer-input --from ./out/mainnet-ledger.json --out ./out/replayer-input.json
          # The replayer needs a ledger it can resolve; an input without one
          # would fail much later, inside a replay.
          test -n "$(jq -r '.genesis_ledger.hash // empty' ./out/replayer-input.json)"
