name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily, to notice a published artifact moving before an operator does.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Read-only unless a job asks for more. The repository default grants write
# to every scope, so a job without its own block would otherwise get it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # The version the docker and deb jobs build into the image and the package.
  # It must be a valid Debian version, and the two jobs must use the same one.
  CI_VERSION: 0.0.0-ci

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

      - name: go build
        run: go build ./...

  release-checks:
    name: release script tests
    # The Release workflow runs only on a tag, so a broken check there would
    # be found only during a release. These tests run the same scripts
    # offline, against a saved deb-s3 listing and a local git repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify-listed.sh and validate-tag.sh
        run: .github/scripts/test-release-checks.sh

  vulncheck:
    name: govulncheck
    # Runs on every pull request and on the daily schedule. A new advisory
    # against the standard library or a dependency then fails the scheduled
    # run even when the code has not changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: .github/scripts/vulncheck.sh

      - name: Toolchain versions agree
        # go.mod, the Dockerfile and the Go that CI installs must name the
        # same release, or the image ships a different compiler than the one
        # the tests and govulncheck ran with.
        run: |
          set -euo pipefail
          mod="$(go mod edit -json | jq -r '.Toolchain')"
          img="$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/go\1/p' Dockerfile)"
          run="$(go env GOVERSION)"
          echo "go.mod toolchain: $mod"
          echo "Dockerfile:       $img"
          echo "installed:        $run"
          [ "$mod" = "$img" ] && [ "$mod" = "$run" ]

  docker:
    name: docker build
    # Needs the package from the deb job, to compare the two versions.
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Into the local image store, so that the next steps can run it.
          load: true
          tags: mina-provision:ci
          build-args: VERSION=${{ env.CI_VERSION }}

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id mina-provision:ci -u)" = 10001

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-package
          path: dist

      - name: Image and package report the same version
        run: .github/scripts/check-version-match.sh mina-provision:ci dist/*.deb

  deb:
    name: deb build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary and package
        # The same flags as release.yml, so that the version check in the
        # docker job sees what a release would produce.
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${CI_VERSION}" \
            -o dist/mina-provision .
          packaging/build-deb.sh dist/mina-provision "$CI_VERSION" "$(dpkg --print-architecture)" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-package
          path: dist/*.deb
          retention-days: 1
      - name: Package is owned by root
        # dpkg applies the ownership recorded in the archive. Built without
        # --root-owner-group it records the builder's uid, which on a target
        # host is an unprivileged user who could then replace the binary.
        run: |
          set -euo pipefail
          listing="$(dpkg-deb -c dist/*.deb)"
          echo "$listing"
          if echo "$listing" | grep -vq "root/root"; then
            echo "the package records ownership other than root/root" >&2
            echo "$listing" | grep -v "root/root" >&2
            exit 1
          fi

      - name: Package installs and runs
        run: |
          sudo dpkg -i dist/*.deb
          test "$(stat -c %U:%G /usr/bin/mina-provision)" = "root:root"
          mina-provision --help

      - name: Every documented command exists
        # The live job is the only other place these names are typed, and it
        # does not run on a pull request -- so without this check a rename
        # passes review and fails on the next scheduled run instead.
        run: |
          set -euo pipefail
          for c in archive blocks daemon-config genesis-config replayer-input; do
            echo "--- $c"
            mina-provision "$c" --help > /dev/null
          done

  live:
    name: live artifact check
    # The default tests never touch the network. This job does, so it runs on a
    # schedule and on demand rather than on every pull request: a published
    # artifact moving is not a reason to block a code change, but it is a
    # reason to find out.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o mina-provision .
      - name: Fetch the daemon config from the live repository
        run: |
          ./mina-provision daemon-config --network mainnet --out ./out -v
          test -n "$(ls ./out/config_*.json)"

      - name: Fetch the fork config and convert it for the replayer
        run: |
          set -euo pipefail
          ./mina-provision genesis-config --network mainnet --out ./out -v
          ./mina-provision replayer-input --from ./out/mainnet-ledger.json --out ./out/replayer-input.json
          # The replayer needs a ledger it can resolve; an input without one
          # would fail much later, inside a replay.
          test -n "$(jq -r '.genesis_ledger.hash // empty' ./out/replayer-input.json)"
