name: Package

# Publishes the Docker image to GHCR on every push to main, so the image tag
# `main` always matches the branch. On a release tag it also publishes the
# versioned image; the .deb packages are handled by release.yml.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# Read-only unless a job asks for more. The repository default grants write
# to every scope, so a job without its own block would otherwise get it.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mina-provision

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so that a tag can be checked against main.
          fetch-depth: 0

      # A tag push publishes a versioned image, so it gets the same check as
      # the Release workflow: a plain vX.Y.Z on main, or nothing is pushed.
      - name: Validate the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./.github/scripts/validate-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # An image is pushed only from code that passes, on a tag and on main.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The .deb records the tag with the leading "v" removed, so the image
      # has to do the same or `mina-provision --version` reports a different
      # string depending on how it was installed. On a branch push the ref name
      # is used as it is.
      - id: version
        run: |
          v="${GITHUB_REF_NAME}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

  version-match:
    name: image and .deb versions agree
    # A release tag only. The .deb comes from the GitHub Release that
    # release.yml makes from the same tag, so this compares the two published
    # artefacts, not two local builds. The published 0.0.3 image reported
    # `v0.0.3` while the 0.0.3 package reported `0.0.3`; the CI check covers
    # the build, and this covers the version each workflow derives from the
    # tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.docker.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the amd64 package from the release
        # release.yml runs in parallel and can finish after this workflow, so
        # the asset is polled for, for up to 20 minutes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --pattern "mina-provision_${VERSION}_amd64.deb" --dir dist --clobber; then
              exit 0
            fi
            echo "attempt $attempt: the release asset is not there yet"
            sleep 30
          done
          echo "mina-provision_${VERSION}_amd64.deb is not attached to release $GITHUB_REF_NAME" >&2
          exit 1

      - name: Image and package report the same version
        # By digest, so the image checked is the one this run pushed. The
        # owner name has capitals, which an image reference must not have.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
        run: |
          .github/scripts/check-version-match.sh "${IMAGE,,}" "dist/mina-provision_${VERSION}_amd64.deb"
