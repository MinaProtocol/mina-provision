name: Release

# Fires on a vX.Y.Z tag. Builds a static binary per architecture, packages each
# as a .deb, attaches everything to a GitHub Release, and publishes the
# packages to the apt repository.

on:
  push:
    tags: [ 'v*' ]

# Read-only unless a job asks for more. The repository default grants write
# to every scope, so a job without its own block would otherwise get it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: the OIDC token proves which workflow
      # run built the files, and the attestation is stored in this repository.
      # Only this job gets them.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries and packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/mina-provision-linux-${arch}" .
            packaging/build-deb.sh "dist/mina-provision-linux-${arch}" "$VERSION" "$arch" dist
          done
          ls -l dist

      - name: Checksums
        # The names are relative, so `sha256sum -c SHA256SUMS` works in the
        # directory the release assets are downloaded into.
        run: |
          set -euo pipefail
          cd dist
          sha256sum mina-provision-linux-* mina-provision_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Provenance attestation
        # A signed statement that these files were built by this workflow, at
        # this commit. `gh attestation verify` checks it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/mina-provision-linux-*
            dist/*.deb
            dist/SHA256SUMS

  publish-apt:
    name: publish ${{ matrix.codename }}/${{ matrix.arch }}
    needs: release
    # Inert until the repository variable PUBLISH_APT is set to "true" and the
    # credentials are present. Without the gate a tag push would fail at the
    # upload step on a repository that cannot publish, rather than simply not
    # publishing.
    if: vars.PUBLISH_APT == 'true'
    # The signing key and the AWS credentials live in this environment, not in
    # the repository. The environment's protection rules (required reviewers,
    # deployment restricted to v* tags) decide whether this job gets them.
    environment: apt-publish
    permissions:
      contents: read
      # Only for the OIDC exchange with AWS when vars.AWS_ROLE_ARN is set.
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      # deb-s3 rewrites the shared index files of a distribution on every
      # upload, and takes a lock in the bucket to do it. Two jobs uploading at
      # once contend for that lock and can drop each other's entries.
      max-parallel: 1
      fail-fast: false
      matrix:
        # amd64 goes to every supported distribution. arm64 goes only to the
        # two that already declare it: publishing it elsewhere would add an
        # architecture to a shared, signed, production distribution as a side
        # effect of releasing this tool.
        include:
          - { codename: bullseye, arch: amd64 }
          - { codename: focal,    arch: amd64 }
          - { codename: jammy,    arch: amd64 }
          - { codename: bookworm, arch: amd64 }
          - { codename: bookworm, arch: arm64 }
          - { codename: noble,    arch: amd64 }
          - { codename: noble,    arch: arm64 }
    env:
      BUCKET: stable.apt.packages.minaprotocol.com
      S3_REGION: us-west-2
      COMPONENT: stable
      # No secret is set at job level: every step, including the ones that
      # run third-party code, would see it. Each secret is given only to the
      # steps that use it.
      CODENAME: ${{ matrix.codename }}
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.2"

      - name: Install deb-s3
        # The MinaProtocol fork, not the upstream gem: the release tooling in
        # this organisation is built against it, and the three available
        # variants of deb-s3 do not agree on their command surface.
        #
        # Pinned to a reviewed commit. This code later runs with the AWS
        # credentials and the signing key, so a new commit on the fork's
        # master must not reach a release without a change here.
        env:
          DEB_S3_COMMIT: 1f3bfb6f51d991bf40e672f65c9e65675ef785c9
        run: |
          set -euo pipefail
          git init -q /tmp/deb-s3
          cd /tmp/deb-s3
          git fetch -q --depth 1 https://github.com/MinaProtocol/deb-s3.git "$DEB_S3_COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$DEB_S3_COMMIT"
          echo "deb-s3 at $(git rev-parse HEAD)"
          gem build deb-s3.gemspec
          sudo gem install ./deb-s3-*.gem

      # After the install, so that no third-party build step runs with AWS
      # credentials. With vars.AWS_ROLE_ARN set, the job assumes that role
      # through GitHub OIDC and gets short-lived credentials; the static keys
      # are then not used. Without it, the static keys in the environment
      # are used as they are.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: mina-provision-release-${{ github.run_id }}
          aws-access-key-id: ${{ vars.AWS_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ vars.AWS_ROLE_ARN == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}

      - name: Import the signing key
        env:
          SIGN_KEY: ${{ secrets.DEBIAN_SIGN_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.DEBIAN_SIGN_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.DEBIAN_SIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_KEY:-}" ] || [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "This repository is signed. DEBIAN_SIGN_KEY_ID and DEBIAN_SIGN_PRIVATE_KEY are required." >&2
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # deb-s3 invokes gpg itself, with no terminal attached, so the agent
          # has to accept a passphrase from the caller instead of a pinentry
          # prompt.
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  >> ~/.gnupg/gpg.conf
          echo "use-agent"               >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            # Prime the agent with one signature of our own, so the signature
            # deb-s3 asks for does not need a passphrase it cannot supply.
            echo priming | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --local-user "$SIGN_KEY" \
              --sign --output /dev/null -
          fi

      - name: Upload the package
        env:
          SIGN_KEY: ${{ secrets.DEBIAN_SIGN_KEY_ID }}
        run: |
          set -euo pipefail
          deb="$(ls dist/mina-provision_"${VERSION}"_"${ARCH}".deb)"
          echo "--- uploading $deb to ${CODENAME}/${COMPONENT}"

          # A release version must not already be present. Overwriting a
          # published package would change what an operator already installed.
          uploaded=0
          for attempt in 1 2 3 4 5; do
            if deb-s3 upload \
                 --bucket "$BUCKET" \
                 --s3-region "$S3_REGION" \
                 --codename "$CODENAME" \
                 --component "$COMPONENT" \
                 --arch "$ARCH" \
                 --fail-if-exists \
                 --preserve-versions \
                 --lock \
                 --cache-control "no-store,no-cache,must-revalidate" \
                 --sign "$SIGN_KEY" \
                 --gpg-options "--batch --pinentry-mode=loopback --yes" \
                 "$deb"; then
              uploaded=1
              break
            fi
            echo "attempt $attempt failed; checking for a stale lock"
            ./.github/scripts/clear-s3-lock.sh "$BUCKET" "$CODENAME" "$COMPONENT" || true
          done
          if [ "$uploaded" -ne 1 ]; then
            echo "upload of $deb to ${CODENAME}/${COMPONENT} failed" >&2
            exit 1
          fi

      - name: Verify the package is listed
        run: |
          set -euo pipefail
          # The exit status of deb-s3 is not a reliable verdict on its own, so
          # the distribution is read back and the version has to appear in it.
          listing="$(deb-s3 list \
            --bucket "$BUCKET" \
            --s3-region "$S3_REGION" \
            --codename "$CODENAME" \
            --component "$COMPONENT" \
            --arch "$ARCH")"
          echo "$listing" | grep -E "^mina-provision" || true
          if ! echo "$listing" | grep -q "$VERSION"; then
            echo "mina-provision $VERSION is absent from ${CODENAME}/${COMPONENT}/${ARCH} after upload" >&2
            exit 1
          fi
          echo "mina-provision $VERSION is published to ${CODENAME}/${COMPONENT}/${ARCH}"

      - name: Invalidate the CDN cache
        # The signed repositories are served through CloudFront. Without this,
        # apt clients keep reading the previous index and signature for as long
        # as the edge caches hold them, and the release is invisible.
        run: ./.github/scripts/invalidate-cdn.sh "$BUCKET" "$CODENAME"
